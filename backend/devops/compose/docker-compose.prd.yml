services:
  db:
    image: postgres:15-alpine
    container_name: db
    restart: always
    env_file:
      - ../../.env.production
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    ports:
      - "${DB_PORT}:${DB_PORT}"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    volumes:
      - redis_data:/data

  api:
    image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPO}:latest
    build:
      context: ../..
      dockerfile: devops/docker/Dockerfile
      target: production
    container_name: api
    restart: always
    env_file:
      - ../../.env.production
    environment:
      DB_HOST: db
      DB_PORT: ${DB_PORT}
      REDIS_HOST: redis
      NODE_ENV: production
    ports:
      - "${PORT}:${PORT}"
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
  redis_data:
