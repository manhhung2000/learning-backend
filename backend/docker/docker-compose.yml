services:
  db:
    image: postgres:15-alpine
    container_name: db
    restart: always
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer
    restart: always
    ports:
      - "8080:8080"

  backend:
    build:
      context: ..
      dockerfile: ${DOCKERFILE:-docker/app.Dockerfile.dev}
    container_name: backend
    restart: always
    env_file:
      - ../.env
    environment:
      DB_HOST: db
      NODE_ENV: ${NODE_ENV:-development}
    ports:
      - "${PORT}:${PORT}"
    volumes:
      - ../src:/app/src
    depends_on:
      - db

volumes:
  postgres_data: